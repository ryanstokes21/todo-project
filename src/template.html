<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <p id="todays-date" class="header-date"></p>
        <p class="header-quote">
          The secret of getting ahead is getting started.
        </p>
      </header>

      <aside class="sidebar">
        <h1>Task<span>Flow</span></h1>

        <nav class="sidebar-nav">
          <div class="nav-header">View</div>
          <button class="nav-button" data-value="dashboard">Dashboard</button>
          <button class="nav-button" data-value="inbox">Inbox</button>
          <button class="nav-button" data-value="today">Today</button>
          <button class="nav-button" data-value="upcoming">Upcoming</button>
          <button class="nav-button" data-value="completed">Completed</button>
        </nav>

        <nav class="sidebar-nav">
          <div class="projects-header">
            <div class="nav-header">Projects</div>

            <button
              id="add-project-btn"
              class="icon-button"
              aria-label="Add project"
            >
              +
            </button>
          </div>
          <div id="project-list"></div>
        </nav>
      </aside>

      <main id="content">
        <section class="tab" id="dashboard-tab">
          <h1>Dashboard</h1>
          <p id="greeting"></p>
        </section>

        <section class="tab" id="inbox-tab">
          <section class="page-header">
            <div>
              <h1>Inbox</h1>
              <p>Stay focused on what matters today.</p>
            </div>

            <button id="open-task-dialog">+ Add Task</button>
          </section>

          <section id="inbox-task-container"></section>
        </section>

        <section class="tab" id="today-tab">
          <section class="page-header">
            <div>
              <h1>Today's Tasks</h1>
              <p>Stay focused on what matters today.</p>
            </div>
          </section>

          <section id="task-container"></section>
        </section>

        <section class="tab" id="upcoming-tab">
          <h1>Upcoming Task</h1>
        </section>

        <section class="tab" id="completed-tab">
          <h1>Completed Task</h1>
        </section>
      </main>

      <dialog id="task-dialog" class="task-dialog">
        <form id="task-form">
          <h2>Create Task</h2>

          <label for="title">Title</label>
          <input type="text" id="title" minlength="5" required />

          <label for="description">Description</label>
          <textarea id="description"></textarea>

          <label for="due-date">Due Date</label>
          <input type="date" id="due-date" />

          <label for="priority">Priority</label>
          <select id="priority">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>

          <div class="dialog-actions">
            <button type="button" id="create-task-btn">Create Task</button>

            <button type="button" id="close-task-btn">Close</button>
          </div>
        </form>
      </dialog>
    </div>
  </body>
</html>
